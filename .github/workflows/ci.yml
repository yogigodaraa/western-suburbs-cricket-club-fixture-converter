name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Check names: "web / test" and "converter / test". Keep job ids stable.
  web:
    uses: yogigodaraa/.github/.github/workflows/node-ci.yml@main
    with:
      working-directory: wscc-web
      # "lint" uses `next lint`, but ESLint isn't installed yet (see issues).
      scripts: "typecheck build"

  converter:
    uses: yogigodaraa/.github/.github/workflows/python-ci.yml@main
    with:
      working-directory: wscc_fixtures
      python-version: "3.12"
